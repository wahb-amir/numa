name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add Hugging Face Space README config
        run: |
          cat <<'EOF' > backend/README.md
          ---
          title: Backend
          emoji: 🚀
          colorFrom: blue
          colorTo: purple
          sdk: docker
          pinned: false
          ---

          # Backend

          Docker-based backend deployed to Hugging Face Spaces.
          EOF

      - name: Deploy to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: backend

